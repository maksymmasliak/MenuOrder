# MySQL. Підключення: COMPOSE_FILE=compose.yaml:docker/compose/mysql.yaml
# У .env постав HOST_DB_PORT=3307.
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      TEST_DB_SUFFIX: ${TEST_DB_SUFFIX:-_test}
    ports:
      - "127.0.0.1:${HOST_DB_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/db/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 (TCP, не сокет): під час першої ініціалізації MySQL піднімає
      # тимчасовий сервер без мережі. Пінг по TCP не дасть «healthy» завчасно.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  app:
    depends_on:
      db:
        condition: service_healthy
  cron:
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
