; Діє лише якщо Xdebug вбудовано (INSTALL_XDEBUG=1). Режим — змінна XDEBUG_MODE у .env.
; PhpStorm: слухає порт 9003, Settings -> PHP -> Servers:
;   Name = COMPOSE_PROJECT_NAME, Host = localhost, Port = HOST_APP_PORT,
;   path mapping: <проєкт>/app -> /var/www/html
xdebug.client_host = host.docker.internal
xdebug.client_port = 9003
xdebug.start_with_request = yes
xdebug.log_level = 0
