; OPcache для розробки: кеш увімкнено (швидше), але зміни у файлах
; підхоплюються одразу (validate_timestamps=1, revalidate_freq=0).
; На проді було б validate_timestamps=0 — тут так НЕ можна.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.interned_strings_buffer = 16
