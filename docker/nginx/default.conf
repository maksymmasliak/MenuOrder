# MenuOrder: єдиний фронт-контролер public/index.php.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root /var/www/html/public;
    index index.php;
    charset utf-8;
    # Фото страв <= 2 МБ перевіряє застосунок; тут лише запас, щоб не ловити 413.
    client_max_body_size 10M;

    # Вбудований DNS Docker. Без цього nginx запам'ятовує IP контейнера app
    # при старті, і після пересоздання app (make rebuild) отримуєш 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $php_upstream app:9000;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Фото страв: лише статика. ^~ — regex-локації нижче сюди не доходять,
    # тому заборона PHP явно всередині.
    location ^~ /uploads/ {
        location ~ \.php$ {
            return 403;
        }
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Не віддавати .env, .git та інші приховані файли.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Виконується ЛИШЕ фронт-контролер. Будь-який інший .php у public/ -> 404.
    location ~ ^/index\.php(/|$) {
        fastcgi_pass $php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        # Пряме звернення /index.php/... ззовні заборонене, лише через try_files.
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
